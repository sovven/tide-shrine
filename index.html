<title>潮の社</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600&family=Shippori+Mincho+B1:wght@500;700;800&display=swap">
<style>
:root{
  /* Layout: full-bleed diorama on washi; the title hangs vertically at the left like a scroll,
     a tide-table panel sits on the right edge. JS re-tints paper/band/ink with the time of day. */
  --paper:#e6e4dc;            /* 白練 washi */
  --band:#3b5d80;             /* 藍 bokashi band, Hiroshige style */
  --ink:#22272e;              /* 墨 */
  --ink-soft:rgba(34,39,46,.62);
  --rule:rgba(34,39,46,.2);
  --shu:#c8432b;              /* 朱, the torii */
  --seal-ink:#f6efe4;
  --f-display:"Shippori Mincho B1","Yu Mincho","Hiragino Mincho ProN","Noto Serif SC","Songti SC",serif;
  --f-body:"Noto Serif SC","Source Han Serif SC","Songti SC","SimSun",serif;
  color-scheme:light;
}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f-body);overflow:hidden;-webkit-font-smoothing:antialiased;transition:color .8s}
#sky,#stars,#washi,#stage{position:fixed;inset:0}
#sky{z-index:0;background:var(--paper)}
#stars{z-index:0;width:100%;height:100%;opacity:0;pointer-events:none}
#washi{z-index:1;pointer-events:none;mix-blend-mode:multiply;opacity:.5}
#stage{z-index:2}
#stage canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
#stage canvas:active{cursor:grabbing}

.eyebrow{margin:0;font:600 11px/1.4 var(--f-body);letter-spacing:.22em;color:var(--ink-soft)}
header.title{position:fixed;z-index:5;left:28px;top:calc(22px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;gap:14px;pointer-events:none}
.scroll{display:flex;flex-direction:row-reverse;align-items:flex-start;gap:16px}
.scroll h1{margin:0;writing-mode:vertical-rl;font:800 clamp(52px,6.4vw,86px)/1 var(--f-display);letter-spacing:.14em;color:var(--ink);transition:color .8s}
.romaji{writing-mode:vertical-rl;font:500 12px/1 var(--f-display);letter-spacing:.3em;color:var(--ink-soft);padding-top:6px}
.seal{width:46px;height:46px;flex:none;margin-top:4px;background:var(--shu);color:var(--seal-ink);display:flex;align-items:center;justify-content:center;writing-mode:vertical-rl;font:800 17px/1.05 var(--f-display);box-shadow:inset 0 0 0 2px var(--shu),inset 0 0 0 3.5px var(--seal-ink);clip-path:polygon(2% 4%,30% 0,62% 3%,98% 1%,100% 36%,97% 70%,99% 97%,64% 100%,31% 97%,1% 99%,3% 64%,0 30%);transform:rotate(-2deg)}
.lede{margin:0;writing-mode:vertical-rl;height:13.5em;font:400 13px/2 var(--f-body);letter-spacing:.08em;color:var(--ink);max-width:none}
footer.howto{position:fixed;z-index:5;left:28px;bottom:calc(24px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:6px;max-width:300px;pointer-events:none}
.howto .line{margin:0;font:700 16px/1.5 var(--f-display);color:var(--ink)}
.howto .keys{margin:0;font:400 12px/1.7 var(--f-body);color:var(--ink-soft)}

#panel{position:fixed;z-index:5;top:calc(20px + env(safe-area-inset-top,0px));right:24px;width:232px;max-height:calc(100% - 40px);overflow:auto;scrollbar-width:none;display:flex;flex-direction:column;gap:16px}
#panel::-webkit-scrollbar{display:none}
.status{display:flex;align-items:center;gap:8px;font:500 11px/1 var(--f-body);letter-spacing:.12em;color:var(--ink-soft)}
.status b{margin-left:auto;font:700 15px/1 var(--f-display);letter-spacing:.04em;color:var(--ink);font-variant-numeric:tabular-nums}
.live{width:6px;height:6px;background:var(--shu);transform:rotate(45deg);animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.25}}
#panel section{display:flex;flex-direction:column;gap:10px;padding-top:12px;border-top:1px solid var(--rule)}
#panel h2{margin:0;display:flex;align-items:baseline;gap:8px;font:600 11px/1 var(--f-body);letter-spacing:.2em;color:var(--ink-soft)}
#panel h2 .k{font:800 19px/1 var(--f-display);letter-spacing:0;color:var(--ink)}
.readout{display:flex;align-items:baseline;gap:5px;font-family:var(--f-display);color:var(--ink)}
.readout b{font-size:34px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.readout small{font-size:13px}
.readout span{margin-left:auto;font:600 13px/1 var(--f-body);color:var(--ink)}
#tideChart{width:100%;height:64px;display:block}
.row{display:grid;grid-template-columns:2.6em 1fr 2.8em;align-items:center;gap:8px;font-size:12px;color:var(--ink)}
.row output{text-align:right;font:600 12px/1 var(--f-display);font-variant-numeric:tabular-nums;color:var(--ink-soft)}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:20px;margin:0;background:transparent;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:1px;background:var(--ink)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:10px;height:10px;margin-top:-5px;background:var(--shu);border:0;transform:rotate(45deg)}
input[type=range]::-moz-range-track{height:1px;background:var(--ink)}
input[type=range]::-moz-range-thumb{width:9px;height:9px;background:var(--shu);border:0;border-radius:0;transform:rotate(45deg)}
input[type=range]:focus-visible{outline:1px dashed var(--ink);outline-offset:3px}
button{font-family:var(--f-body);color:var(--ink)}
button:focus-visible{outline:2px solid var(--shu);outline-offset:2px}
.toggle{align-self:flex-start;display:inline-flex;align-items:center;gap:8px;padding:0;border:0;background:none;font-size:12px;cursor:pointer}
.toggle::before{content:"";width:9px;height:9px;border:1px solid var(--ink)}
.toggle[aria-pressed=true]::before{background:var(--shu);border-color:var(--shu)}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.act{display:flex;align-items:center;gap:9px;padding:8px 9px;border:1px solid var(--ink);background:transparent;font-size:13px;cursor:pointer;text-align:left;transition:background .15s,color .15s}
.act b{font:800 21px/1 var(--f-display)}
.act:hover:not([disabled]){background:var(--ink);color:var(--paper)}
.act:active:not([disabled]){transform:translateY(1px)}
.act[disabled]{opacity:.4;cursor:default}
.counts{margin:0;font:400 11px/1 var(--f-body);letter-spacing:.06em;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.seasons{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.sea{position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;padding:0 0 6px;border:1px solid var(--rule);background:transparent;cursor:pointer}
.sea i{display:block;width:100%;height:16px;background:var(--c)}
.sea b{font:800 17px/1 var(--f-display);margin-top:3px}
.sea small{font:500 10px/1 var(--f-display);color:var(--ink-soft)}
.sea[aria-pressed=true]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.sea[aria-pressed=true]::after{content:"";position:absolute;right:-4px;top:-4px;width:8px;height:8px;background:var(--shu)}
.foot{display:flex;gap:14px;flex-wrap:wrap;padding-top:12px;border-top:1px solid var(--rule)}
.plain{padding:0;border:0;background:none;font-size:12px;cursor:pointer;color:var(--ink);border-bottom:1px solid transparent}
.plain:hover{border-bottom-color:var(--ink)}

#toast{position:fixed;z-index:6;left:50%;bottom:calc(30px + env(safe-area-inset-bottom,0px));transform:translate(-50%,8px);display:flex;align-items:center;gap:14px;white-space:nowrap;pointer-events:none;opacity:0;transition:opacity .6s,transform .6s;color:var(--ink)}
#toast.on{opacity:1;transform:translate(-50%,0)}
#toast::before,#toast::after{content:"";width:40px;height:1px;background:var(--ink)}
#toast .k{font:800 22px/1 var(--f-display);color:var(--shu)}
#toast .t{font:500 14px/1 var(--f-body);letter-spacing:.06em}

@media (max-width:820px){
  header.title{left:16px;top:calc(12px + env(safe-area-inset-top,0px));gap:8px}
  .scroll{gap:10px}
  .scroll h1{font-size:40px}
  .lede,.romaji,footer.howto,.status{display:none}
  .seal{width:34px;height:34px;font-size:12px}
  #panel{top:auto;bottom:0;left:0;right:0;width:auto;max-height:42%;padding:10px 16px calc(12px + env(safe-area-inset-bottom,0px));background:var(--paper);border-top:1px solid var(--rule);gap:12px}
  #panel .sec-acts{order:-1;border-top:0;padding-top:0}
  #panel .sec-acts h2{display:none}
  .acts{grid-template-columns:repeat(4,1fr)}
  .act{flex-direction:column;gap:4px;padding:8px 2px;text-align:center;font-size:12px}
  #toast{bottom:calc(42% + 14px)}
  #toast::before,#toast::after{width:18px}
}
@media (prefers-reduced-motion:reduce){.live{animation:none}#toast{transition:none}}
</style>

<div id="sky"></div>
<canvas id="stars"></canvas>
<div id="washi"></div>
<div id="stage"></div>

<header class="title">
  <p class="eyebrow">潮汐习作 · Nº 02</p>
  <div class="scroll">
    <h1>潮の社</h1>
    <span class="romaji">SHIO NO YASHIRO</span>
    <div class="seal" aria-hidden="true">潮音</div>
    <p class="lede">海上一座朱红鸟居。潮水退去，人能走到它脚下；潮水涨回，它又独自立在海中。</p>
  </div>
</header>

<footer class="howto">
  <p class="eyebrow">玩法</p>
  <p class="line">退潮时走去鸟居，涨潮后撑船穿过它。</p>
  <p class="keys">拖动旋转　滚轮缩放　点水面起涟漪　入夜后放灯笼</p>
</footer>

<aside id="panel" aria-label="控制面板">
  <div class="status"><i class="live"></i><span>实时</span><span id="phase">白昼</span><b id="clock">16:00</b></div>
  <section class="sec-tide">
    <h2><span class="k">潮</span>潮位</h2>
    <div class="readout"><b id="tideNum">2.3</b><small>m</small><span id="tideState">涨潮中 ↑</span></div>
    <canvas id="tideChart" aria-label="一天的潮汐曲线"></canvas>
    <div class="row"><label for="tide">潮位</label><input id="tide" type="range" min="0" max="100" value="60"><output id="tideVal" for="tide">60</output></div>
    <button id="autoTide" class="toggle" aria-pressed="true">随时间涨落</button>
  </section>
  <section class="sec-acts">
    <h2><span class="k">社</span>社前</h2>
    <div class="acts">
      <button class="act" id="actLantern"><b>灯</b><span>放灯笼</span></button>
      <button class="act" id="actBell"><b>鐘</b><span>撞钟</span></button>
      <button class="act" id="actKoi"><b>鯉</b><span>喂锦鲤</span></button>
      <button class="act" id="actBoat"><b>舟</b><span>渡船</span></button>
    </div>
    <p class="counts" id="counts">灯笼 0　钟声 0　渡船 0</p>
  </section>
  <section class="sec-season">
    <h2><span class="k">季</span>季节</h2>
    <div class="seasons">
      <button class="sea" data-s="spring" aria-pressed="false"><i style="--c:#eeb4c3"></i><b>春</b><small>桜</small></button>
      <button class="sea" data-s="summer" aria-pressed="false"><i style="--c:#6f9a48"></i><b>夏</b><small>青葉</small></button>
      <button class="sea" data-s="autumn" aria-pressed="true"><i style="--c:#cf4a2c"></i><b>秋</b><small>紅葉</small></button>
      <button class="sea" data-s="winter" aria-pressed="false"><i style="--c:#dfe3e8"></i><b>冬</b><small>雪</small></button>
    </div>
  </section>
  <section class="sec-scene">
    <h2><span class="k">景</span>风与时</h2>
    <div class="row"><label for="wind">风浪</label><input id="wind" type="range" min="0" max="100" value="28"><output id="windVal" for="wind">28</output></div>
    <div class="row"><label for="clarity">清澈</label><input id="clarity" type="range" min="0" max="100" value="62"><output id="clarityVal" for="clarity">62</output></div>
    <div class="row"><label for="hour">时刻</label><input id="hour" type="range" min="0" max="24" step="0.05" value="16"><output id="hourVal" for="hour">16:00</output></div>
  </section>
  <div class="foot">
    <button id="pause" class="plain">暂停时间</button>
    <button id="sound" class="plain" aria-pressed="true">声音 开</button>
    <button id="resetView" class="plain">复位视角</button>
  </div>
</aside>

<div id="toast" role="status" aria-live="polite"><span class="k"></span><span class="t"></span></div>

<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const $ = s => document.querySelector(s);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const lerp = (a, b, t) => a + (b - a) * t;
const sm = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
let seed = 20261020;
const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const R = (a, b) => a + (b - a) * rnd();
const MOBILE = matchMedia('(max-width: 820px)').matches || matchMedia('(pointer: coarse)').matches;
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;
const TAU = Math.PI * 2;

/* ---------------- world constants ---------------- */
const BASE_Y = -3.6, LOW = -1.4, HIGH = -0.05, AX = 0.3, F = 0.25;
const TORII = { x: AX, z: 1.9 };
const HOURS_PER_SEC = 0.1;          // a full day in 4 minutes

/* ---------------- terrain ---------------- */
function hash2(i, j) { const s = Math.sin(i * 127.1 + j * 311.7) * 43758.5453; return s - Math.floor(s); }
function vnoise(x, z) {
  const i = Math.floor(x), j = Math.floor(z), fx = x - i, fz = z - j;
  const u = fx * fx * (3 - 2 * fx), v = fz * fz * (3 - 2 * fz);
  const a = hash2(i, j), b = hash2(i + 1, j), c = hash2(i, j + 1), d = hash2(i + 1, j + 1);
  return (a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v) * 2 - 1;
}
const fbm = (x, z) => vnoise(x, z) * 0.55 + vnoise(x * 2.03 + 5.2, z * 2.03 + 1.3) * 0.3 + vnoise(x * 4.1 + 9.1, z * 4.1 + 3.7) * 0.15;
function H0(x, z) {
  const n = fbm(x * 0.55 + 11.3, z * 0.55 - 4.1), n2 = fbm(x * 1.9 - 7, z * 1.9 + 2);
  let h = -0.84 - 0.04 * z + 0.05 * n + 0.015 * n2;                 // tidal flat
  h -= 1.5 * sm(2.5, 4.9, z + 0.2 * x + 0.45 * n);                 // channel to the open sea
  const shore = -3.15 + 0.22 * Math.sin(x * 0.85 + 0.4) + 0.18 * n;
  const l = sm(shore + 0.35, shore - 0.75, z);
  const dx = x + 3.7, dz = z + 4.1;
  const land = 0.3 + 0.16 * n + 0.05 * n2 + 0.12 * sm(-3.6, -5, z) + 1.7 * Math.exp(-(dx * dx + dz * dz) / 2);
  h = lerp(h, land, l);
  const hl = sm(-3.1, -4.4, x + 0.4 * n) * sm(1.4, -1.0, z);          // headland on the left
  const head = 0.12 + 0.35 * sm(0.8, -2.5, z) + 0.14 * n + 0.05 * n2;
  return lerp(h, Math.max(h, head), hl);
}
const GN = 129;
const heights = new Float32Array(GN * GN);
for (let j = 0; j < GN; j++) for (let i = 0; i < GN; i++) heights[j * GN + i] = H0(-5 + 10 * i / 128, -5 + 10 * j / 128);
function groundAt(x, z) {
  const fx = clamp((x + 5) * 12.8, 0, 128), fz = clamp((z + 5) * 12.8, 0, 128);
  const i = Math.min(127, Math.floor(fx)), j = Math.min(127, Math.floor(fz));
  const tx = fx - i, tz = fz - j;
  const a = heights[j * GN + i], b = heights[j * GN + i + 1], c = heights[(j + 1) * GN + i], d = heights[(j + 1) * GN + i + 1];
  return lerp(lerp(a, b, tx), lerp(c, d, tx), tz);
}
const hData = new Uint16Array(GN * GN);
for (let k = 0; k < GN * GN; k++) hData[k] = THREE.DataUtils.toHalfFloat(heights[k]);
const heightTex = new THREE.DataTexture(hData, GN, GN, THREE.RedFormat, THREE.HalfFloatType);
heightTex.magFilter = heightTex.minFilter = THREE.LinearFilter;
heightTex.needsUpdate = true;

/* ---------------- state ---------------- */
const prefersDark = matchMedia('(prefers-color-scheme: dark)').matches;
const tideCurve = h => 0.5 + 0.5 * Math.cos(TAU * (h - 18.5) / 12.4);
const state = {
  hour: prefersDark ? 20.6 : 16.0, timeRun: !REDUCED, autoTide: true, manualF: 0.6,
  f: 0, level: 0, levelVel: 0, wet: 0, wind: 0.28, clarity: 0.62, night: 0,
  season: 'autumn', sound: true, lanterns: 0, bells: 0, trips: 0,
};
state.f = tideCurve(state.hour); state.level = lerp(LOW, HIGH, state.f); state.wet = state.level;

/* ---------------- renderer ---------------- */
const stage = $('#stage');
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, MOBILE ? 1.5 : 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x000000, 0);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.08;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.shadowMap.autoUpdate = false;
stage.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(30, innerWidth / innerHeight, 0.5, 220);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.dampingFactor = 0.08; controls.enablePan = false;
controls.minPolarAngle = 0.3; controls.maxPolarAngle = 1.36; controls.minDistance = 9; controls.maxDistance = 48;
controls.rotateSpeed = 0.6; controls.zoomSpeed = 0.8;
const VIEW = { target: new THREE.Vector3(0.2, -0.9, -0.3), polar: 1.0, az: 0.62 };
function viewDistance() {
  const a = camera.aspect, t = Math.tan(THREE.MathUtils.degToRad(camera.fov / 2));
  return Math.max(33, 9.6 / (t * a));
}
function viewPos(out) {
  const d = viewDistance();
  return out.set(Math.sin(VIEW.polar) * Math.sin(VIEW.az), Math.cos(VIEW.polar), Math.sin(VIEW.polar) * Math.cos(VIEW.az)).multiplyScalar(d).add(VIEW.target);
}
controls.target.copy(VIEW.target); viewPos(camera.position); controls.update();

/* ---------------- lights ---------------- */
const hemi = new THREE.HemisphereLight(0xffffff, 0x886644, 1.2); scene.add(hemi);
const sun = new THREE.DirectionalLight(0xffffff, 3);
sun.castShadow = true;
sun.shadow.mapSize.set(MOBILE ? 1024 : 2048, MOBILE ? 1024 : 2048);
Object.assign(sun.shadow.camera, { left: -11, right: 11, top: 11, bottom: -11, near: 1, far: 70 });
sun.shadow.bias = -0.0006; sun.shadow.normalBias = 0.025;
sun.target.position.set(0, -1, 0); scene.add(sun, sun.target);
const nightLights = [];
for (const [x, z] of [[AX, -1.7], [-1.4, -2.6], [2.4, -2.6]]) {
  const p = new THREE.PointLight(0xffa860, 0, 3.6, 1.6); p.position.set(x, F + 0.45, z); scene.add(p); nightLights.push(p);
}
const flood = new THREE.SpotLight(0xffd7a8, 0, 9, 0.42, 0.7, 1.2);
flood.position.set(AX + 0.6, 0.5, 5.6); flood.target.position.set(AX, 1.3, TORII.z); scene.add(flood, flood.target);

/* ---------------- shared uniforms & GLSL ---------------- */
const C = c => new THREE.Color(c);
const U = {
  uTime: { value: 0 }, uLevel: { value: state.level }, uWet: { value: state.wet }, uWind: { value: state.wind },
  uHigh: { value: HIGH }, uHeightTex: { value: heightTex }, uSunAmt: { value: 1 }, uDay: { value: 1 }, uSnowAmt: { value: 0 },
  uSand: { value: C('#cdb58c') }, uSilt: { value: C('#8d8977') }, uGrass: { value: C('#83904a') }, uRock: { value: C('#7f776c') },
  uSnow: { value: C('#eef1f3') }, uSoil: { value: C('#5a4535') }, uSky: { value: C('#bfd0d8') },
  uS1: { value: C('#d6c29c') }, uS2: { value: C('#b7a585') }, uS3: { value: C('#977a5b') }, uS4: { value: C('#6c5545') }, uS5: { value: C('#4a3f38') },
};
const NOISE = `
uniform sampler2D uHeightTex;
float tnHash(vec2 p){ vec3 p3 = fract(vec3(p.xyx)*0.1031); p3 += dot(p3, p3.yzx + 33.33); return fract((p3.x + p3.y)*p3.z); }

  U.uTime.value += dt; const T = U.uTime.value;
  if (state.timeRun && !hourDragging) state.hour = (state.hour + dt * HOURS_PER_SEC) % 24;
  const target = state.autoTide ? tideCurve(state.hour) : state.manualF;
  state.f += (target - state.f) * Math.min(1, dt * 1.3);
  const prev = state.level;
  state.level = lerp(LOW, HIGH, state.f);
  state.levelVel = lerp(state.levelVel, (state.level - prev) / Math.max(dt, 1e-4), 0.05);
  state.wet = Math.max(state.level, state.wet - dt * 0.012);
  U.uLevel.value = state.level; U.uWet.value = state.wet;
  applyTime(dt); applySeason(dt);
  updateLanterns(dt, T); updateKoi(dt, T); updateBoat(dt, T); updateWalkers(dt, T); updateDeer(dt); updateParticles(dt, T);
  for (const L of lampsHang) {
    L.kick = Math.max(0, (L.kick || 0) - dt * 0.35);
    L.pivot.rotation.z = Math.sin(T * 5 + L.phase) * 0.25 * L.kick + Math.sin(T * 0.9 + L.phase) * 0.03 * state.wind;
  }
  let li = 0;
  for (let i = lanterns.length - 1; i >= 0 && li < 14; i--) { const L = lanterns[i]; if (depthAt(L.x, L.z) > 0.03) lantU[li++].set(L.x, 0, L.z, state.night); }
  for (const sx of [-1, 1]) if (li < 16) lantU[li++].set(AX + sx * 0.22, 0, -0.25, state.night * 0.8);
  if (li < 16 && depthAt(boat.x, boat.z) > 0.03) lantU[li++].set(boat.x + Math.sin(boat.h) * 0.34, 0, boat.z + Math.cos(boat.h) * 0.34, state.night * 0.6);
  for (; li < 16; li++) lantU[li].w = 0;
  if (audio.waveGain) audio.waveGain.gain.value = 0.05 + 0.22 * state.wind + 0.04 * Math.sin(T * 0.45);
  if (camAnim) {
    camAnim.t = Math.min(1, camAnim.t + dt / 1.1); const e = 1 - Math.pow(1 - camAnim.t, 3);
    camera.position.lerpVectors(camAnim.p0, camAnim.p1, e); controls.target.lerpVectors(camAnim.t0, VIEW.target, e);
    if (camAnim.t >= 1) camAnim = null;
  }
  controls.update();
  renderReflection();
  renderer.shadowMap.needsUpdate = true;
  renderer.render(scene, camera);
  updateUI(dt);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
